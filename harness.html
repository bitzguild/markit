<!doctype html>
<!--
  Dev-only browser harness: stubs Tauri's IPC so the real frontend can be
  exercised in a plain browser via `npm run dev` → http://localhost:1420/harness.html.
  Not part of the production build (Vite only bundles index.html).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Markit harness</title>
    <script>
      const DOC = new URL(new URLSearchParams(location.search).get("doc") || "examples/showcase.md", location.href).pathname;
      window.__harness = { calls: [], writes: {} };
      let cb = 0;
      window.__TAURI_INTERNALS__ = {
        metadata: { currentWindow: { label: "main" }, currentWebview: { windowLabel: "main", label: "main" } },
        transformCallback(fn) { const id = ++cb; window["_" + id] = fn; return id; },
        unregisterCallback(id) { delete window["_" + id]; },
        convertFileSrc(path) { return path.startsWith("/") ? path.replace(window.__harness.root, "") : path; },
        async invoke(cmd, args) {
          window.__harness.calls.push([cmd, args]);
          switch (cmd) {
            case "frontend_ready": return window.__harness.root + DOC;
            case "read_file": return (await fetch(args.path.replace(window.__harness.root, ""))).text();
            case "write_file": window.__harness.writes[args.path] = args.content; return null;
            case "list_user_themes": return [];
            case "allow_asset": return null;
            default: return null;
          }
        },
      };
      // Pretend files live under a fake absolute root so path logic is exercised.
      window.__harness.root = "/Users/harness/markit";
    </script>
    <style id="theme"></style>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar" class="no-print">
        <div class="side-tabs">
          <button data-tab="outline" class="active">Outline</button>
          <button data-tab="recent">Recent</button>
        </div>
        <nav id="outline" class="side-panel"></nav>
        <nav id="recent" class="side-panel hidden"></nav>
      </aside>
      <main id="main">
        <div id="scroller">
          <div id="editor" class="md-doc"></div>
          <textarea id="source" class="hidden" spellcheck="false"></textarea>
        </div>
        <footer id="status" class="no-print">
          <span id="status-file">Untitled</span>
          <span class="spacer"></span>
          <span id="status-mode"></span>
          <span id="status-count"></span>
        </footer>
      </main>
    </div>
    <div id="toast" class="no-print"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
